name: Sync Repository Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests before sync
        run: python3 -m unittest discover -s tests -v
      - name: Update repository metadata and render static cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-repos.py
      - name: Validate idempotency, JS syntax, and post-sync tests
        run: |
          node --check app.js
          python3 scripts/sync-repos.py --render-only
          python3 -m unittest discover -s tests -v
      - name: Commit changes if any
        # Note: Commits pushed with GITHUB_TOKEN do not trigger legacy GitHub Pages builds automatically
        # unless dispatched manually or followed by an authenticated push.
        run: |
          if [ -n "$(git status --porcelain data/repositories.json index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/repositories.json index.html
            git commit -m "chore: sync repository metadata"
            git push
          fi
