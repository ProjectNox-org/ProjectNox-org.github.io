name: Sync Repository Metadata and Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.final_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests before sync
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Update repository metadata and render static cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync-repos.py
          git add data/repositories.json index.html
      - name: Validate idempotency, JS syntax, and post-sync tests
        run: |
          python3 scripts/sync-repos.py --render-only
          git diff --exit-code -- index.html data/repositories.json
          node --check app.js
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Commit synced catalog changes if any
        run: |
          if ! git diff --cached --quiet -- data/repositories.json index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync repository metadata"
            git push
          fi
      - name: Record validated SHA
        id: final_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp -a index.html styles.css app.js particles.js assets data extensoes project-nox-tracker project-nox-scan-staff LICENSE NOTICE _site/
          for f in 404.html robots.txt sitemap.xml favicon.ico; do
            if [ -e "$f" ]; then cp -a "$f" _site/; fi
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
